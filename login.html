<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="login">
        <h1>Welcome back!</h1>
        <p>Enter your details to access your account</p>

        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />

        <div class="options">
          <div class="remember">
            <input type="checkbox" />
            <span>Remember me</span>
          </div>

          <a href="#">Forgot password?</a>
        </div>

        <button>Sign In</button>

        <div class="signup">
          <p>Don't have an account?</p>
          <a href="#">Sign up</a>
        </div>
      </div>

      <div class="side">
        <div class="about">
          <h1>About Us</h1>
          <h3>
            We help people access amazing digital experiences with simplicity
            and speed.
          </h3>
        </div>
      </div>
    </div>
  </body>
</html>
